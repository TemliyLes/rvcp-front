    <!-- =========================================================
         COOKIEBOT DELAY
         0–4 сек: баннер скрыт
         после 4 сек: баннер показывается
         ========================================================= -->
    <script>
      (() => {
        const DELAY = 4000;

        const startedAt = performance.now();

        let allowDisplay = false;
        let dialogWasHidden = false;
        let releaseTimer = null;

        function releaseCookiebot() {
          if (allowDisplay) return;

          allowDisplay = true;

          console.log("⏱ 4 секунды прошло");

          /*
           * Если первоначальный Cookiebot действительно
           * был показан и нами скрыт —
           * открываем его повторно.
           */
          if (
            dialogWasHidden &&
            window.Cookiebot &&
            typeof window.Cookiebot.renew === "function"
          ) {
            console.log("👁 Показываем Cookiebot");

            window.Cookiebot.renew();
          }
        }

        /*
         * Cookiebot сообщает, что диалог появился.
         */
        window.addEventListener(
          "CookiebotOnDialogDisplay",
          () => {
            console.log("🍪 CookiebotOnDialogDisplay");

            /*
             * Это уже второй показ после истечения 4 секунд.
             * Больше не скрываем.
             */
            if (allowDisplay) {
              console.log("✅ Cookiebot оставляем видимым");
              return;
            }

            /*
             * Первый показ — сразу скрываем.
             */
            if (
              window.Cookiebot &&
              typeof window.Cookiebot.hide === "function"
            ) {
              window.Cookiebot.hide();

              dialogWasHidden = true;

              console.log("🙈 Cookiebot сразу скрыт");
            }

            /*
             * Показываем баннер именно на 4-й секунде
             * от начала загрузки страницы.
             */
            if (!releaseTimer) {
              const elapsed = performance.now() - startedAt;

              const remaining = Math.max(0, DELAY - elapsed);

              releaseTimer = window.setTimeout(releaseCookiebot, remaining);
            }
          },
          false,
        );

        /*
         * Страховочный таймер.
         *
         * Если Cookiebot успел появиться и был скрыт —
         * откроем его на 4-й секунде.
         *
         * Если Cookiebot вообще не показывался
         * (например, пользователь уже дал consent),
         * насильно его не открываем.
         */
        window.setTimeout(() => {
          if (dialogWasHidden) {
            releaseCookiebot();
          } else {
            allowDisplay = true;
          }
        }, DELAY);
      })();
    </script>
